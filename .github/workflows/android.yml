name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK installation
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileCut-0.0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish version 0.0.1 (once)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v0.0.1 >/dev/null 2>&1; then
            git tag v0.0.1
            git push origin v0.0.1
            gh release create v0.0.1 app/build/outputs/apk/debug/app-debug.apk#MobileCut-0.0.1-debug.apk --title 'MobileCut 0.0.1' --notes 'First Android beta. Import, preview, trim and export videos locally. This is a debug-signed beta APK.' --prerelease
          fi
